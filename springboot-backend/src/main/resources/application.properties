server.port=${PORT:8000}

# PostgreSQL Datasource Configuration (Neon Cloud Database)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-misty-pine-b47ufy3g.c-6.us-east-2.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_U1y0nhPRxlNJ}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File upload / payload size
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Static Web Resources
spring.web.resources.static-locations=classpath:/static/
